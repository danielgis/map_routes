<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Leaflet Mobile Tracking</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="lib/leaflet.css" />
    <link rel="stylesheet" href="styles.css?v=20260506-1" />
</head>
<body>

    <div id="map"></div>
    <section id="recorridosPanel" class="recorridos-panel" aria-label="Lista de recorridos">
        <div class="recorridos-panel-header">
            <span>Recorridos</span>
            <div class="recorridos-header-actions">
                <button id="sortRecorridosBtn" class="recorridos-sort" type="button" title="Ordenar lista" aria-label="Orden ascendente">&#x2191; Asc</button>
                <button id="toggleRecorridosPanel" class="recorridos-toggle" type="button" aria-expanded="true">Minimizar</button>
            </div>
        </div>
        <div id="recorridosList" class="recorridos-list"></div>
    </section>

    <!-- Leaflet JS -->
    <script src="lib/leaflet.js"></script>
    <!-- Esri Leaflet JS -->
    <script src="lib/esri-leaflet.js"></script>
    <!-- TextPath para etiquetas paralelas a lineas -->
    <script src="lib/leaflet.textpath.js"></script>
    <script src="app.js?v=20260506-2"></script>
</body>
</html>
