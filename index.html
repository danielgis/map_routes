<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Leaflet Mobile Tracking</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css?v=20260504-1" />
</head>
<body>

    <div id="map"></div>
    <section id="recorridosPanel" class="recorridos-panel" aria-label="Lista de recorridos">
        <div class="recorridos-panel-header">
            <span>Recorridos</span>
            <button id="toggleRecorridosPanel" class="recorridos-toggle" type="button" aria-expanded="true">Minimizar</button>
        </div>
        <div id="recorridosList" class="recorridos-list"></div>
    </section>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Esri Leaflet JS -->
    <script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>
    <!-- TextPath para etiquetas paralelas a lineas -->
    <script src="https://unpkg.com/leaflet-textpath@1.2.3/leaflet.textpath.js"></script>
    <script src="app.js?v=20260504-1"></script>
</body>
</html>
